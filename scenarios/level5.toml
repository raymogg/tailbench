# Level 5 -- the same tails, but capacity you can exhaust.
#
# Hardest of the five, and deliberately NOT hardest by being faster. The rate
# (350rps) and budget (40ms) are only a little tighter than level 4. What
# changes is that svc_b now has capacity 6 against ~3.0 calls of offered
# concurrency -- about 50% utilised before the program does anything.
#
# That inverts the level 3 lesson. A retry is no longer close to free: it takes
# a permit, and the permit it takes is one a first attempt needed. Hedge every
# call at 6ms and svc_b saturates, queue wait counts toward its 70ms timeout,
# and the queueing you added costs more than the stragglers you dodged. In the
# calibration sweep the ordering of hedge delays inverts around here: at
# capacity 5 a 25ms hedge beats a 6ms hedge, which is the opposite of level 3.
#
# So the program has to be selective -- about which downstream it retries, when,
# and how many in flight at once -- rather than applying one policy everywhere.
# Four dependencies on the widest class (35ms of mean work against a 40ms
# budget) leave no room to be careless.
#
# Reference: naive cvar_99 400ms (94.5% ok) -> best ~200ms (99.5% ok).
# Headroom ~50%, and unlike the lower levels an indiscriminate hedge can make
# things worse rather than merely failing to help.
#
# TUNING. `svc_b.capacity` is the knob that sets this level's character, and it
# is sharp. Modelled cvar_99 for an early (6ms) vs late (25ms) hedge:
#
#     cap  util   naive   hedge@6  hedge@25   which wins
#      16   19%   400.0     189.4     202.6   early
#      10   30%   400.0     188.7     201.3   early
#       8   37%   400.0     188.9     190.5   early (margin nearly gone)
#       6   50%   400.0     218.9     215.2   late   <- the value used here
#       5   60%   400.0     384.4     288.8   late, decisively
#       4   75%   400.0     400.0     400.0   neither; unwinnable
#
# At capacity >= 8 this level is just level 3 again with more downstreams. At
# capacity <= 4 nothing recovers and cvar_99 sits at penalty_ms whatever the
# program does. 6 is the value where retrying still pays but only if it is
# timed and targeted -- which is the reasoning the level exists to test.
# Re-run that sweep on the target host before trusting the number.
[scenario]
id         = "level5-saturated"
seed       = 1005
duration_s = 60.0
warmup_s   = 5.0

[load]
arrival  = "poisson"
rate_rps = 350.0

[slo]
budget_ms = 40.0

[[request_class]]
name     = "cheap"
weight   = 0.35
requires = ["svc_a"]

[[request_class]]
name     = "mid"
weight   = 0.35
requires = ["svc_a", "svc_b"]

[[request_class]]
name     = "full"
weight   = 0.30
requires = ["svc_a", "svc_b", "svc_c", "svc_d"]

[[downstream]]
id           = "svc_a"
distribution = { kind = "lognormal", median_ms = 5.0, sigma = 0.45 }
capacity     = 48
timeout_ms   = 70.0

[[downstream]]
id           = "svc_b"
distribution = { kind = "bimodal", fast_ms = 3.0, slow_ms = 130.0, p_slow = 0.08 }
capacity     = 6
timeout_ms   = 70.0

[[downstream]]
id           = "svc_c"
distribution = { kind = "pareto", scale_ms = 3.0, alpha = 1.8 }
capacity     = 16
timeout_ms   = 70.0

[[downstream]]
id           = "svc_d"
distribution = { kind = "lognormal", median_ms = 8.0, sigma = 0.6 }
capacity     = 20
timeout_ms   = 70.0
