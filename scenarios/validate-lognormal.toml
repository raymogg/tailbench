# §10.1: measured quantiles should match the closed form.
[scenario]
id         = "validate-lognormal-001"
seed       = 42
duration_s = 20.0
warmup_s   = 2.0

[load]
arrival  = "poisson"
rate_rps = 300.0

[slo]
budget_ms = 120.0

[[request_class]]
name     = "cheap"
weight   = 1.0
requires = ["svc_a"]

[[downstream]]
id           = "svc_a"
distribution = { kind = "lognormal", median_ms = 8.0, sigma = 0.6 }
capacity     = 1024
timeout_ms   = 250.0
