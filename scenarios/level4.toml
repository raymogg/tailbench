# Level 4 -- two different tail shapes at once, on a tighter budget.
#
# Level 3 had one straggler and one right answer. Here the two tail sources
# fail differently and do not want the same treatment:
#
#   svc_b  bimodal   4ms / 140ms at 7%   -- discrete. A hedge either lands in
#                                           the fast mode or does not; retrying
#                                           early is strictly good.
#   svc_c  pareto    alpha 1.7           -- continuous and unbounded. There is
#                                           no "slow mode" to escape; the draw
#                                           can be any size, so a hedge helps
#                                           on average but guarantees nothing,
#                                           and a *timeout* is the sharper tool.
#
# Capacity on svc_b is 24 against ~2.4 offered, so retries are affordable but no
# longer free. The budget (50ms) is under the sum of the three means (31ms) plus
# tail, so the widest class needs concurrency AND tail handling together --
# neither alone clears it.
#
# Reference: naive cvar_99 500ms (95.4% ok) -> best ~155ms (99.72% ok).
# Headroom ~69%.
[scenario]
id         = "level4-heavy-tail"
seed       = 1004
duration_s = 60.0
warmup_s   = 5.0

[load]
arrival  = "poisson"
rate_rps = 300.0

[slo]
budget_ms = 50.0

[[request_class]]
name     = "cheap"
weight   = 0.4
requires = ["svc_a"]

[[request_class]]
name     = "mid"
weight   = 0.35
requires = ["svc_a", "svc_b"]

[[request_class]]
name     = "full"
weight   = 0.25
requires = ["svc_a", "svc_b", "svc_c"]

[[downstream]]
id           = "svc_a"
distribution = { kind = "lognormal", median_ms = 7.0, sigma = 0.5 }
capacity     = 64
timeout_ms   = 90.0

[[downstream]]
id           = "svc_b"
distribution = { kind = "bimodal", fast_ms = 4.0, slow_ms = 140.0, p_slow = 0.07 }
capacity     = 24
timeout_ms   = 90.0

[[downstream]]
id           = "svc_c"
distribution = { kind = "pareto", scale_ms = 4.0, alpha = 1.7 }
capacity     = 24
timeout_ms   = 90.0
