[package]
name = "tailbench"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "signal"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bincode = "1"
futures = "0.3"

[[bin]]
name = "loadgen"
path = "src/bin/loadgen.rs"

[[bin]]
name = "mocks"
path = "src/bin/mocks.rs"
