# Virtual workspace. The split is a security boundary, not tidiness: the program
# under test depends on `tailbench-abi` only, so the scorer (`oracle`), the
# scenario (`config`), and the seeded draws (`call_digest`) are unreachable from
# it at compile time.
[workspace]
resolver = "2"
members = ["crates/tailbench-abi", "crates/tailbench", "crates/program"]
