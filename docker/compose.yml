# three components, three containers, disjoint pinned cores.
#
# Three processes: loadgen measures, program is the code under test,
# downstreams provides its dependencies. Cores assume a 12-core Linux host.
#
# Isolation comes from the cpuset plus
# `isolcpus` on the host, NOT from containerisation -- a container without a
# cpuset shares the host CPU pool and looks pinned while being nothing of the
# kind.
#
# SCENARIO and REPEAT are required (`:?`), not defaulted. Both containers read
# the same SCENARIO, so it cannot differ between them -- a run where loadgen and
# downstreams used different configs would still produce a report.
#
# worker_threads must equal the cpuset width: a tokio runtime defaulting to
# num_cpus sees the *host* count and oversubscribes, reintroducing exactly the
# scheduling jitter this split exists to remove.

x-build: &build
  build:
    context: ..
    dockerfile: docker/Dockerfile

services:
  downstreams:
    <<: *build
    cpuset: "6-9"
    environment:
      TOKIO_WORKER_THREADS: "4"
      TAILBENCH_CPUSET: "6-9"
    volumes:
      - sock:/run/tailbench
      - ../scenarios:/scenarios:ro
    command: >
      downstreams --config /scenarios/${SCENARIO:?set SCENARIO=<file.toml>; no default, so a run cannot silently use the wrong config}
                  --socket /run/tailbench/downstreams.sock

  program:
    <<: *build
    cpuset: "2-5"
    environment:
      TOKIO_WORKER_THREADS: "4"
      TAILBENCH_CPUSET: "2-5"
    volumes:
      - sock:/run/tailbench
    depends_on:
      - downstreams
    command: >
      program --listen /run/tailbench/program.sock
              --downstreams /run/tailbench/downstreams.sock

  loadgen:
    <<: *build
    cpuset: "0-1"
    environment:
      TOKIO_WORKER_THREADS: "2"
      TAILBENCH_CPUSET: "0-1"
    volumes:
      - sock:/run/tailbench
      - ../scenarios:/scenarios:ro
      - ../results:/results
    depends_on:
      - program
    command: >
      loadgen run --config /scenarios/${SCENARIO:?set SCENARIO=<file.toml>; no default, so a run cannot silently use the wrong config}
                  --socket /run/tailbench/program.sock
                  --out /results
                  --repeat ${REPEAT:?set REPEAT=<n> (1 for a single run)}

volumes:
  sock:
