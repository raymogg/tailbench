# three components, three containers, disjoint pinned cores.
#
# Three processes: loadgen measures, service is the code under test, mocks
# provides its dependencies. Cores assume a 12-core Linux host.
#
# Isolation comes from the cpuset plus
# `isolcpus` on the host, NOT from containerisation -- a container without a
# cpuset shares the host CPU pool and looks pinned while being nothing of the
# kind.
#
# worker_threads must equal the cpuset width: a tokio runtime defaulting to
# num_cpus sees the *host* count and oversubscribes, reintroducing exactly the
# scheduling jitter this split exists to remove.

x-build: &build
  build:
    context: ..
    dockerfile: docker/Dockerfile

services:
  mocks:
    <<: *build
    cpuset: "6-9"
    environment:
      TOKIO_WORKER_THREADS: "4"
      TAILBENCH_CPUSET: "6-9"
    volumes:
      - sock:/run/tailbench
      - ../scenarios:/scenarios:ro
    command: >
      mocks --config /scenarios/${SCENARIO:-fanout-bimodal.toml}
            --socket /run/tailbench/mocks.sock

  service:
    <<: *build
    cpuset: "2-5"
    environment:
      TOKIO_WORKER_THREADS: "4"
      TAILBENCH_CPUSET: "2-5"
    volumes:
      - sock:/run/tailbench
    depends_on:
      - mocks
    command: >
      service --listen /run/tailbench/service.sock
              --mocks /run/tailbench/mocks.sock

  loadgen:
    <<: *build
    cpuset: "0-1"
    environment:
      TOKIO_WORKER_THREADS: "2"
      TAILBENCH_CPUSET: "0-1"
    volumes:
      - sock:/run/tailbench
      - ../scenarios:/scenarios:ro
      - ../results:/results
    depends_on:
      - service
    command: >
      loadgen run --config /scenarios/${SCENARIO:-fanout-bimodal.toml}
                  --socket /run/tailbench/service.sock
                  --out /results
                  --repeat ${REPEAT:-1}

volumes:
  sock:
